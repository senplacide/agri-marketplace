<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | AgriConnect</title>

<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ux-styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
<a href="#main-content" class="ux-skip-link">Skip to main content</a>

<div class="navbar">

<div class="logo">🌾 AgriConnect</div>

<ul class="nav-links">
<li><a href="/">Home</a></li>
<li><a href="/items">Marketplace</a></li>
<li><a href="/about">About</a></li>
<li><a href="/contact">Contact</a></li>
</ul>

</div>

<div class="content" id="main-content">

<div class="card form-wrap">

<h1>Reset Password</h1>

<p>
Enter the verification code you received and choose a new password.
</p>

<form id="reset-form">

<label>Email</label>

<input
type="email"
id="reset-email"
readonly>

<label>Reset Code</label>

<input
type="text"
id="reset-code"
name="reset-code"
maxlength="6"
inputmode="numeric"
pattern="[0-9]{6}"
placeholder="123456"
required>

<label>New Password</label>

<input
type="password"
id="reset-password"
name="reset-password"
placeholder="New password"
required>

<button
type="submit"
class="btn primary-btn">

Reset Password

</button>

</form>

<p id="reset-status"></p>

</div>

</div>

<script src="/reset-password.js"></script>
<script src="ux-utils.js"></script>

</body>
</html>
