<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ux-styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
<a href="#main-content" class="ux-skip-link">Skip to main content</a>

<div class="navbar">

<div class="logo">🌾 AgriConnect</div>

<ul class="nav-links">
<li><a href="/">Home</a></li>
<li><a href="/items">Marketplace</a></li>
<li><a href="/about">About</a></li>
<li><a href="/contact">Contact</a></li>
</ul>

<div class="content" id="main-content">

<div class="card form-wrap">

<h1>Forgot Password</h1>

<p>

Enter the email address associated with your account.
We'll send you a 6-digit password reset code.

</p>

<form id="forgot-password-form">

<label for="reset-email">

Email

</label>

<input
type="email"
id="reset-email"
name="reset-email"
placeholder="email@example.com"
required>

<button
type="submit"
class="btn primary-btn">

Send Reset Code

</button>

</form>

<p id="forgot-status"></p>

</div>

</div>

<script src="/forgot-password.js"></script>
<script src="ux-utils.js"></script>

</body>
